services:
  blizzbeat:
    # Prebuilt image from GitHub Actions (rebuilt on every push to main).
    # Update with: docker compose pull && docker compose up -d
    image: ghcr.io/ctrlaltspoods/blizzbeat:latest
    # Or build it yourself instead: docker compose up -d --build
    build: .
    container_name: blizzbeat
    restart: unless-stopped
    stop_grace_period: 20s # time to save the queue and leave voice cleanly
    env_file: .env
    volumes:
      - blizzbeat-data:/data # settings database + custom banners
      - blizzbeat-plugins:/opt/lavalink/plugins # cached Lavalink plugins
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  blizzbeat-data:
  blizzbeat-plugins:
