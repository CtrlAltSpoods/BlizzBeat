name: Smoke test

# Builds the image and exercises the real bot code against a real Lavalink
# (YouTube/SoundCloud search + stream loading, slash command handling, player embed).
# Discord itself is faked. Doesn't block publishing; it's a health report.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'assets/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default-clients
            clients: ''
            cipher: false
          - label: broad-clients
            clients: MUSIC,TVHTML5_SIMPLY,ANDROID_MUSIC,MWEB,WEB,IOS,WEBEMBEDDED,ANDROID_VR
            cipher: false
          - label: broad-clients+yt-cipher
            clients: MUSIC,TVHTML5_SIMPLY,ANDROID_MUSIC,MWEB,WEB,IOS,WEBEMBEDDED,ANDROID_VR
            cipher: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: blizzbeat:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start yt-cipher
        if: matrix.cipher
        run: |
          docker run -d --name ytc --network host -e OVERRIDE_PLAYER_VARIANT=IAS -e OVERRIDE_SCRIPT_VARIANT=IAS ghcr.io/kikkia/yt-cipher:master
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8001/ && break; sleep 2; done
          docker logs ytc 2>&1 | tail -5

      - name: Bot + Lavalink smoke test
        run: |
          docker run --rm --network host -v "$PWD/scripts:/app/scripts:ro" \
            -e SMOKE_LABEL='${{ matrix.label }}' \
            -e YOUTUBE_CLIENTS='${{ matrix.clients }}' \
            -e YOUTUBE_REMOTE_CIPHER_URL='${{ matrix.cipher && 'http://127.0.0.1:8001' || '' }}' \
            --entrypoint /app/scripts/smoke.sh blizzbeat:smoke

      - name: Full container startup (fake token, Unraid PUID/PGID)
        if: always() && matrix.label == 'default-clients'
        run: |
          docker run -d --name bb -e DISCORD_TOKEN=invalid.token.value -e PUID=99 -e PGID=100 blizzbeat:smoke
          for _ in $(seq 1 90); do docker logs bb 2>&1 | grep -q "Starting Blizzbeat" && break; sleep 2; done
          sleep 15
          echo "-------- container log --------"
          docker logs bb 2>&1 | grep -vE "^\s+at |DEBUG" | tail -60
          docker logs bb 2>&1 | grep -q "Lavalink is up. Starting Blizzbeat"
          docker logs bb 2>&1 | grep -qiE "TokenInvalid|invalid token|Login failed"
